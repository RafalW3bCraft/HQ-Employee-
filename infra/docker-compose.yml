version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: webcraft_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: webcraft
      POSTGRES_PASSWORD: webcraft_secure_password
      POSTGRES_DB: webcraft_employee
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webcraft -d webcraft_employee"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
